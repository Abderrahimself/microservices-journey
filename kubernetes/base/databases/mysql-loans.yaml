apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-loans-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-loans
  labels:
    app: mysql-loans
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-loans
  template:
    metadata:
      labels:
        app: mysql-loans
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "root"
        - name: MYSQL_DATABASE
          value: "loansdb"
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-loans-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-loans
spec:
  selector:
    app: mysql-loans
  ports:
  - port: 3306
    targetPort: 3306
  type: ClusterIP
